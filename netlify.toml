[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Forward all /api/* requests to Netlify Serverless Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# SPA navigation fallback: serve index.html for all frontend routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Optimize caching for static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
